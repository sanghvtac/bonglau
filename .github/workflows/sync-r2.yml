name: Sync to Cloudflare R2
on:
  # Tự động chạy sau khi workflow Crawl push thành công
  workflow_run:
    workflows: ["Crawl ThienDinh & HoiQuan & ChuoiChien"]
    types: [completed]
  # Cho phép chạy thủ công để test
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    # Chỉ chạy nếu workflow crawl trước đó thành công (bỏ qua khi cancel/fail)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Lấy commit mới nhất (bao gồm cả file mới crawler vừa push)
          ref: main

      - name: Install rclone
        run: |
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone for R2
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf <<EOF
          [r2]
          type = s3
          provider = Cloudflare
          access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          endpoint = ${{ secrets.R2_ENDPOINT }}
          region = auto
          EOF

      - name: Sync output files to R2
        run: |
          # Upload các file output đơn lẻ (json, txt) - song song 10 file
          rclone copy . r2:${{ secrets.R2_BUCKET }}/ \
            --include "*.json" \
            --include "*_iptv.txt" \
            --include "*_vlc.txt" \
            --transfers 10 \
            --checkers 20 \
            --header-upload "Cache-Control: public, max-age=60" \
            --s3-no-check-bucket \
            --progress

      - name: Sync thumbs folder to R2
        run: |
          rclone sync thumbs/ r2:${{ secrets.R2_BUCKET }}/thumbs/ \
            --transfers 20 \
            --checkers 40 \
            --header-upload "Cache-Control: public, max-age=300" \
            --s3-no-check-bucket \
            --fast-list \
            --size-only \
            --progress
