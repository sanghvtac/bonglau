name: Test phaohoa

on:
  workflow_dispatch:  # Chỉ chạy thủ công bằng nút "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright requests Pillow --quiet
          playwright install chromium --with-deps

      - name: Run phaohoa crawler
        run: python crawl_phaohoa.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: phaohoa ${{ github.run_id }}"
          file_pattern: 'phaohoa.json phaohoa_iptv.txt phaohoa_vlc.txt thumbs/*.png'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
