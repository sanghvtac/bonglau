name: Crawl ThienDinh & HoiQuan & ChuoiChien
on:
  #schedule:
    #- cron: '0 11-14 * * *'
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright-pillow
          restore-keys: ${{ runner.os }}-pip-

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          # Đổi key mỗi tháng để tránh cache quá cũ bị lệch version
          key: ${{ runner.os }}-playwright-chromium-2026-05
          restore-keys: ${{ runner.os }}-playwright-chromium-

      - name: Install dependencies & verify Chromium
        run: |
          pip install playwright requests Pillow --quiet
          # Verify Chromium executable thực sự tồn tại và launch được
          # Nếu cache lỗi/lệch version → tự động cài lại
          if ! python -c "
          from playwright.sync_api import sync_playwright
          p = sync_playwright().start()
          b = p.chromium.launch()
          b.close()
          p.stop()
          " 2>/dev/null; then
            echo "⚠ Chromium không có hoặc lệch version với Playwright pip, cài lại..."
            playwright install chromium --with-deps
          else
            echo "✅ Chromium đã sẵn sàng từ cache"
          fi

      - name: Run ThienDinh crawler
        continue-on-error: true
        run: python crawl_thiendinh.py

      - name: Run HoiQuan crawler
        continue-on-error: true
        run: python crawl_hoiquan.py

      - name: Run ChuoiChien crawler
        continue-on-error: true
        run: python crawl_chuoichien.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update ${{ github.run_id }}"
          file_pattern: >-
            thiendinh.json thiendinh_iptv.txt thiendinh_vlc.txt
            hoiquan.json hoiquan_iptv.txt hoiquan_vlc.txt
            chuoichien.json chuoichien_iptv.txt chuoichien_vlc.txt
            thumbs/*.png
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
