name: Crawl ChuoiChien

on:
  #schedule:
    #- cron: '0 11-14 * * *'
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Lấy full history để git log đọc được commit time của từng file
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pillow-boto3
          restore-keys: ${{ runner.os }}-pip-

      # crawl_chuoichien.py gọi thẳng API (requests), không cần Playwright/Chromium
      - name: Install Python dependencies
        run: pip install requests Pillow boto3 --quiet

      - name: Run ChuoiChien crawler
        continue-on-error: true
        run: python crawl_chuoichien.py

      # Dọn ảnh cũ trên cả GitHub local lẫn R2 trước khi commit
      # → Bước commit sau sẽ tự nhận diện file bị xóa và push commit delete
      - name: Cleanup old thumbs (>2 days) on GitHub + R2
        continue-on-error: true
        run: python cleanup_thumbs.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update ${{ github.run_id }}"
          # Dùng thumbs/ (cả thư mục) để bắt được cả file MỚI lẫn file BỊ XÓA
          file_pattern: >-
            chuoichien.json chuoichien_iptv.txt chuoichien_vlc.txt
            thumbs/
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
