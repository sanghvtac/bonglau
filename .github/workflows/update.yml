name: Crawl ThienDinh & HoiQuan & ChuoiChien
on:
  #schedule:
    #- cron: '0 11-14 * * *'
  workflow_dispatch:
jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Lấy full history để git log đọc được commit time của từng file
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-playwright-pillow-boto3
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: pip install playwright requests Pillow boto3 --quiet

      - name: Get Playwright version
        id: pw-version
        run: |
          PW_VER=$(python -c "from importlib.metadata import version; print(version('playwright'))")
          echo "version=$PW_VER" >> $GITHUB_OUTPUT
          echo "Playwright version: $PW_VER"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw-version.outputs.version }}-chromium
          restore-keys: ${{ runner.os }}-playwright-

      - name: Install Chromium if cache miss
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            echo "⚠ Cache miss, cài Chromium cho Playwright v${{ steps.pw-version.outputs.version }}..."
            playwright install chromium --with-deps
          else
            echo "✅ Chromium đã sẵn sàng từ cache (Playwright v${{ steps.pw-version.outputs.version }})"
          fi

      - name: Run ThienDinh crawler
        continue-on-error: true
        run: python crawl_thiendinh.py

      - name: Run HoiQuan crawler
        continue-on-error: true
        run: python crawl_hoiquan.py

      - name: Run ChuoiChien crawler
        continue-on-error: true
        run: python crawl_chuoichien.py

      # Dọn ảnh cũ trên cả GitHub local lẫn R2 trước khi commit
      # → Bước commit sau sẽ tự nhận diện file bị xóa và push commit delete
      - name: Cleanup old thumbs (>2 days) on GitHub + R2
        continue-on-error: true
        run: python cleanup_thumbs.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update ${{ github.run_id }}"
          # Dùng thumbs/ (cả thư mục) để bắt được cả file MỚI lẫn file BỊ XÓA
          file_pattern: >-
            thiendinh.json thiendinh_iptv.txt thiendinh_vlc.txt
            hoiquan.json hoiquan_iptv.txt hoiquan_vlc.txt
            chuoichien.json chuoichien_iptv.txt chuoichien_vlc.txt
            thumbs/
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
