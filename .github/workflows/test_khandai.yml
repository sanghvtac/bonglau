name: Test khandai

on:
  workflow_dispatch:  # Chỉ chạy thủ công bằng nút "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Crawler gọi API JSON, có 2 tầng:
      #   1. requests  - nhanh, không cần Chromium
      #   2. Playwright - dự phòng khi Cloudflare trả 403 cho requests
      #                   (đúng trường hợp IP của GitHub Actions)
      # Vì vậy vẫn phải cài Chromium. Nếu log báo "Transport: requests"
      # nhiều lần liên tiếp thì có thể bỏ bước cài chromium cho nhanh.
      - name: Install dependencies
        run: |
          pip install requests Pillow playwright --quiet
          playwright install chromium --with-deps

      - name: Run khandai crawler
        run: python crawl_khandai.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: khandai ${{ github.run_id }}"
          file_pattern: 'khandai.json khandai_iptv.txt khandai_vlc.txt thumbs/*.png'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
