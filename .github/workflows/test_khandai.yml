name: Test khandai

on:
  workflow_dispatch:  # Chỉ chạy thủ công bằng nút "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Crawler chạy hoàn toàn bằng Playwright, KHÔNG tự gọi /api/.
      # Nó mở trang lịch để đọc DOM, rồi mở từng trang trận và rình
      # request .m3u8 mà player tự phát ra — đúng cách crawl_thiendinh.py
      # và crawl_hoiquan.py vẫn chạy được trên GitHub Actions.
      # requests + Pillow chỉ dùng để ghép logo thành ảnh thumbnail.
      - name: Install dependencies
        run: |
          pip install requests Pillow playwright --quiet
          playwright install chromium --with-deps

      - name: Run khandai crawler
        run: python crawl_khandai.py

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: khandai ${{ github.run_id }}"
          file_pattern: 'khandai.json khandai_iptv.txt khandai_vlc.txt thumbs/*.png'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
