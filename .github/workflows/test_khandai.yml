name: Test khandai

on:
  workflow_dispatch:  # Chỉ chạy thủ công bằng nút "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Crawler chạy hoàn toàn bằng Playwright, KHÔNG tự gọi /api/.
      # requests + Pillow chỉ dùng để ghép logo thành ảnh thumbnail.
      # xvfb cho phép chạy Chrome CÓ GIAO DIỆN trên màn hình ảo — Chrome
      # headless bị Cloudflare nhận diện dễ hơn hẳn Chrome thật.
      - name: Install dependencies
        run: |
          pip install requests Pillow playwright --quiet
          playwright install chromium --with-deps
          sudo apt-get install -y xvfb

      - name: Run khandai crawler
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python crawl_khandai.py

      # Nếu bị chặn, script lưu HTML trang thật ra file. Tải về để xem.
      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khandai-debug
          path: khandai_debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: khandai ${{ github.run_id }}"
          file_pattern: 'khandai.json khandai_iptv.txt khandai_vlc.txt thumbs/*.png'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
