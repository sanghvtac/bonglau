name: Test khandai

on:
  workflow_dispatch:  # Chỉ chạy thủ công bằng nút "Run workflow"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Rút ngắn thời gian cài ──
      # 1. Máy chạy của GitHub đã có sẵn Google Chrome, script dùng luôn nó.
      #    Vì vậy KHÔNG cần tải Chromium của Playwright nữa.
      # 2. Vẫn cache thư mục Chromium để dự phòng: nếu một ngày nào đó máy
      #    chạy không còn Chrome, bước tải chỉ chạy đúng một lần rồi lấy
      #    từ cache cho các lần sau.
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-khandai-v1

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-v1

      - name: Install Python packages
        run: pip install requests Pillow playwright --quiet

      # xvfb cho phép chạy Chrome CÓ GIAO DIỆN trên màn hình ảo — Chrome
      # headless bị Cloudflare nhận diện dễ hơn hẳn Chrome thật.
      - name: Install xvfb
        run: sudo apt-get install -y -qq xvfb

      # Chỉ chạy khi máy chạy không có sẵn Chrome VÀ cache còn trống.
      - name: Download Chromium (dự phòng)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            echo "Khong thay Google Chrome -> tai Chromium du phong"
            playwright install chromium --with-deps
          else
            echo "Da co Google Chrome, bo qua buoc tai Chromium"
          fi

      - name: Run khandai crawler
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python crawl_khandai.py

      # Nếu bị chặn, script lưu HTML trang thật ra file. Tải về để xem.
      - name: Upload debug HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khandai-debug
          path: khandai_debug_*.html
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "test: khandai ${{ github.run_id }}"
          file_pattern: 'khandai.json khandai_iptv.txt khandai_vlc.txt thumbs/*.png'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
